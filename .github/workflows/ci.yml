name: CI/CD Pipeline — P2P Mesh Workspace (2026)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # JOB 1 : Analyse Syntaxique & Parité Stricte Extension ⇆ WebApp
  syntax-and-parity:
    name: 🔍 Syntax & SHA-256 Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérification Syntaxique (node --check)
        run: node "APPLICATIONS/Communications/P2P/scripts/check-syntax.js"

      - name: Vérification Parité Stricte SHA-256 (Extension ⇆ WebApp)
        run: node "APPLICATIONS/Communications/P2P/scripts/check-parity.js"

  # JOB 2 : Tests Unitaires Natifs & WebCrypto
  unit-tests:
    name: 🧪 Unit & WebCrypto Tests
    runs-on: ubuntu-latest
    needs: syntax-and-parity
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exécution des Tests Unitaires (node:test)
        run: |
          cd "APPLICATIONS/Communications/P2P"
          node --test test/unit/*.test.js

  # JOB 3 : Fuzzing CRDT & Benchmarking de Performance
  fuzzing-and-benchmarks:
    name: 🌪️ CRDT Fuzzing & Performance Benchmarks
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exécution du Fuzzing CRDT (10 000 Mutations)
        run: |
          cd "APPLICATIONS/Communications/P2P"
          node test/fuzz/crdt-convergence.test.js

      - name: Exécution des Benchmarks de Débit
        run: |
          cd "APPLICATIONS/Communications/P2P"
          node test/bench/perf-benchmarks.js

  # JOB 4 : Empaquetage Hermétique Chrome MV3
  package-extension:
    name: 📦 Package MV3 Extension
    runs-on: ubuntu-latest
    needs: [unit-tests, fuzzing-and-benchmarks]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Empaqueter l'Extension ZIP
        run: |
          cd "APPLICATIONS/Communications/P2P"
          node scripts/package-extension.js

      - name: Archiver le ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-extension-mv3
          path: APPLICATIONS/Communications/P2P/dist/*.zip
