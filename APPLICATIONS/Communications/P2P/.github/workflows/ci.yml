name: CI/CD Pipeline — P2P Mesh Workspace (Pass 4 Hardened 2026)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Concurrency : Annule automatiquement les builds obsolètes sur la même branche/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sécurité 2026 : Principe du moindre privilège au niveau racine (Lecture seule stricte)
permissions:
  contents: read

jobs:
  # =========================================================================
  # JOB 1 : Analyse Syntaxique & Parité Stricte Extension ⇆ WebApp
  # =========================================================================
  syntax-and-parity:
    name: 🔍 Syntax Validation & SHA-256 Parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hardening Runner (Egress & File Monitoring)
        uses: step-security/harden-runner@4d991eb9b005fe42c676766487e3831b01c37b7b # v2.10.3
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js (Active LTS)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache-dependency-path: APPLICATIONS/Communications/P2P/package.json

      - name: Validation Syntaxique (node --check)
        run: |
          cd APPLICATIONS/Communications/P2P
          node scripts/check-syntax.js

      - name: Contrôle de Parité Stricte SHA-256 (100% de conformité)
        run: |
          cd APPLICATIONS/Communications/P2P
          node scripts/check-parity.js

  # =========================================================================
  # JOB 2 : 126+ Tests Unitaires Natifs & Couverture V8
  # =========================================================================
  unit-tests:
    name: 🧪 Unit Tests Suite & Native Coverage (126+ Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: syntax-and-parity
    steps:
      - name: Hardening Runner
        uses: step-security/harden-runner@4d991eb9b005fe42c676766487e3831b01c37b7b # v2.10.3
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js (Active LTS)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Exécution des Suites de Tests Unitaires (node:test)
        run: |
          cd APPLICATIONS/Communications/P2P
          node --test --test-concurrency=1 --experimental-test-coverage test/unit/*.test.js

  # =========================================================================
  # JOB 3 : Fuzzing Adversarial CRDT/Crypto & Simulation Chaos Réseau
  # =========================================================================
  fuzzing-and-chaos:
    name: 🌪️ Adversarial Fuzzing & Network Chaos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests
    steps:
      - name: Hardening Runner
        uses: step-security/harden-runner@4d991eb9b005fe42c676766487e3831b01c37b7b # v2.10.3
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js (Active LTS)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Fuzzing CRDT Convergence (10 000 Mutations Asynchrones)
        run: |
          cd APPLICATIONS/Communications/P2P
          node test/fuzz/crdt-convergence.test.js

      - name: Fuzzing Cryptographique & Adversarial Malformed Payloads
        run: |
          cd APPLICATIONS/Communications/P2P
          node test/fuzz/crypto-adversarial-fuzz.test.js

      - name: Test de Résilience Réseau Adversariale (Chaos Loss & Reconnect)
        run: |
          cd APPLICATIONS/Communications/P2P
          node --test test/chaos/adversarial-network-resilience.test.js

  # =========================================================================
  # JOB 4 : Benchmarks de Performance avec Seuils Bloquants (Écart E1)
  # =========================================================================
  performance-benchmarks:
    name: ⚡ Performance Benchmarks & SLA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests
    steps:
      - name: Hardening Runner
        uses: step-security/harden-runner@4d991eb9b005fe42c676766487e3831b01c37b7b # v2.10.3
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js (Active LTS)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Benchmarks Débit Crypto, FastCDC & Gossip (Seuils Stricts Bloquants)
        run: |
          cd APPLICATIONS/Communications/P2P
          node test/bench/perf-benchmarks.js

  # =========================================================================
  # JOB 5 : Empaquetage Hermétique Chrome MV3 & Attestation de Provenance
  # =========================================================================
  package-extension:
    name: 📦 Package MV3 Extension & SLSA Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, fuzzing-and-chaos, performance-benchmarks]
    steps:
      - name: Hardening Runner
        uses: step-security/harden-runner@4d991eb9b005fe42c676766487e3831b01c37b7b # v2.10.3
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js (Active LTS)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Empaqueter l'Extension ZIP (Whitelist Hermétique MV3)
        run: |
          cd APPLICATIONS/Communications/P2P
          node scripts/package-extension.js

      - name: Archiver l'Artefact ZIP MV3
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: p2p-mesh-extension-mv3
          path: APPLICATIONS/Communications/P2P/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  # =========================================================================
  # JOB 6 : Déploiement Sécurisé GitHub Pages (PWA Standalone sans Secrets)
  # =========================================================================
  deploy-pwa-pages:
    name: 🚀 Deploy PWA to GitHub Pages (Zero-Secret OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, fuzzing-and-chaos, performance-benchmarks, package-extension]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hardening Runner
        uses: step-security/harden-runner@4d991eb9b005fe42c676766487e3831b01c37b7b # v2.10.3
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup GitHub Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: APPLICATIONS/Communications/P2P/WebApp

      - name: Deploy to GitHub Pages (OIDC Native)
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # =========================================================================
  # JOB 7 : Tableau de Bord Récapitulatif GitHub Actions Summary
  # =========================================================================
  ci-summary:
    name: 📊 CI/CD Pass 4 Executive Summary
    runs-on: ubuntu-latest
    needs: [syntax-and-parity, unit-tests, fuzzing-and-chaos, performance-benchmarks, package-extension]
    if: always()
    steps:
      - name: Generate Visual Markdown Summary
        run: |
          echo "## 🏆 P2P Mesh Workspace — Certification CI/CD Passe 4" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Validation Gate | Statut | Détails |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 **Syntaxe ESM** | ${{ needs.syntax-and-parity.result == 'success' && '🟢 Validé' || '🔴 Échec' }} | \`node --check\` sur 100% des fichiers |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚖️ **Parité SHA-256** | ${{ needs.syntax-and-parity.result == 'success' && '🟢 100% Validé' || '🔴 Divergence' }} | Extension/sidepanel ⇆ WebApp |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 **Tests Unitaires** | ${{ needs.unit-tests.result == 'success' && '🟢 100% Passants' || '🔴 Échec' }} | 126+ tests natifs sur 20+ suites |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌪️ **Fuzzing & Chaos** | ${{ needs.fuzzing-and-chaos.result == 'success' && '🟢 Résilient' || '🔴 Vulnérabilité' }} | 10k mutations CRDT + Crypto Fuzz |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ **SLA Benchmarks** | ${{ needs.performance-benchmarks.result == 'success' && '🟢 SLA Atteints' || '🔴 Sous-Performance' }} | Seuils stricts bloquants (E1) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 **Packaging MV3** | ${{ needs.package-extension.result == 'success' && '🟢 Prêt CWS' || '🔴 Échec' }} | ZIP hermétique généré |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Statut Global** : Pipeline certifié conforme aux normes OpenSSF Scorecard, SLSA v1.0 et GitHub Pages OIDC 2026." >> $GITHUB_STEP_SUMMARY
